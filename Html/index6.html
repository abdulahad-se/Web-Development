<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!--This is demo style.css file to learn the inline and block elements-->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--Inline elements do not start on a new line and only take up as much width as necessary. They are part of the flow within other elements.
    Inline elements can contain other inline elements, but they generally should not contain block-level elements. For example, you could nest a <strong> (strong emphasis) element within a <span> (a generic inline container) element, like so:-->
        <p>I am block element</p>
        <a href="https://www.google.com">Google</a><!--anchor is an inline element so it take space according to its width unlike block element like paragraph or div which take full width due to which other element have to appear on newline-->
        <div>I am an Block element</div><!--Block-level elements are those that start on a new line and take up the entire width of their container by default. They essentially claim all the horizontal space for themselves, pushing any content that comes after them to a new line.-->
        <span>I am inline element</span><!--it is like a div but it is inline element-->
    
</body>
</html>
