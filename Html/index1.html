<!DOCTYPE html> <!-- Tells the browser that this document is written in modern HTML5 -->
<html lang="en"> <!-- The root element of the page; 'lang="en"' sets the primary language to English -->
<head> <!-- Contains metadata, title, and external resource links not visible directly on the page -->
    <!--Meta is self closing tag-->
    <meta charset="UTF-8"> <!-- Sets character encoding to UTF-8 so special characters and symbols render correctly -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Makes the layout responsive across mobile, tablet, and desktop screens -->
    <title>Introduction to Html</title> <!-- Defines the title displayed on the browser tab -->
    <link rel="stylesheet" href="style.css"> <!-- Connects an external CSS file to style the HTML page -->
</head> <!-- Closes the metadata section -->
<body> <!-- Contains all visible content displayed on the webpage -->
    Author : Mirza Abdul Ahad Baig. <!-- Plain text displayed directly on the webpage -->
    <script src="script.js"></script> <!-- Links an external JavaScript file to add interactivity and logic -->
</body> <!-- Closes the visible content section -->
</html> <!-- Closes the root HTML element -->
