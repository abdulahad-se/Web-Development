<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors</title>
    <style>
        /* colors keyword */
        h1{
            /* color: red; */
            /* ye google se nikala hai instead of memorizing google ne mujhe code diya or mene copy */
            /* color: #0bEE0B; */
            /* ab rbg ka matlab hota hai red green blue (ab har ek ki value 255 tak hoti hai to ham apna hisaab se sb ki value adjust karke bana sakte hai color) */
            /* color: rgb(132, 42, 35); */
            /* rgba ya same hai rgb ka bs isme alpha hai jiski value ya 0 ya 1 ya inke darmiyan ki , alpha basically iski opacity hoti hai */
            /* color: rgba(85, 141, 197, 0.36); */
            /* hsl or isi tarhe hsla bhi hota hai  */
            color: hsl(240, 2%, 24%);
            /* background ma bhi same exactly isi tarha color de sakte hai */
            background-color: rgb(132, 42, 35);
            

        }


    </style>
</head>
<body>
    <h1>This is colors</h1>
    <p>
        <ol>
            <!-- is me hamme kisi bhi color ka hex color code diya jata hai -->
            <li>Hex Color Code</li>
            <!-- is me hame rbg code diya jata hai hm wo marzi hai google se search karke nikal loya khud banalo wo uper dikha howa hai kah kese bana hai rbg -->
            <li>RGB</li>
            <!-- ye same rgb hi hai bs isme alpha hai jiski value 0 or 1 ka darmiyan ya exact 0 ya 1 hoti hai -->
            <li>RGBA</li>
            <!-- h=Hue which mean type of color, s=saturation and l=lightness, according to harry its not use so much but iska pata hona chahiya atleast -->
            <li>HSL</li>
        </ol>
    </p>
    
</body>
</html>
