<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors</title>
    <!DOCTYPE html>
<html lang="en">
<head>
    <style>
        /* colors keyword */
        h1{
            /* color: red; */
            /* ye google se nikala hai instead of memorizing google ne mujhe code diya or mene copy */
            /* color: #0bEE0B; */
            /* RGB stands for Red, Green, Blue (each value ranges from 0 to 255, so we can adjust values to build custom colors) */
            /* color: rgb(132, 42, 35); */
            /* RGBA is the same as RGB, but with an added alpha channel (value ranges from 0 to 1) which represents opacity */
            /* color: rgba(85, 141, 197, 0.36); */
            /* HSL works similarly, and HSLA is also available in the same way */
            color: hsl(240, 2%, 24%);
            /* Background color can also be applied using the exact same format */
            background-color: rgb(132, 42, 35);

        }
    </style>
</head>
<body>
    <h1>This is colors</h1>
    <p>
        <ol>
            <!-- Here we pass a hex color code for any color -->
            <li>Hex Color Code</li>
            <!-- Here we pass an RGB color code; we can search on Google or build it manually as shown above using RGB -->
            <li>RGB</li>
            <!-- This is the same as RGB, but includes an alpha channel whose value ranges between 0 and 1 (or exactly 0 to 1) -->
            <li>RGBA</li>
            <!-- H = Hue (type of color), S = Saturation, and L = Lightness; good to know the concept at least -->
            <li>HSL</li>
        </ol>
    </p>
</body>
</html>
