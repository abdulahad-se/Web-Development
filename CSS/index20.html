<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS-Transition</title>
    <!-- Transitions:The CSS transition property allows you to smoothly animate changes between styles over a given period of time. Instead of instantly jumping from one style to another, transitions create a gradual effect, making web elements more interactive and visually appealing.
    Syntax:
    transition: property duration timing-function delay;
    property → the CSS property you want to animate (width, height, color, transform etc.). Use all to apply transitions to all animatable properties.
    duration → how long the transition takes (e.g., 2s, 500ms).
    timing-function → how the transition progresses over time (ease, linear, ease-in, ease-out, ease-in-out, or custom cubic-bezier).
    delay → wait before the transition starts. -->
    <style>
        .container{
            border: 2px solid;
            width: 60vw;
            height: 70vh;
        }
        .box{
            background-color: aqua;
            border: 2px solid;
            width: 15vw;
            height: 14vh;
            /* transition-property:transform; */
            /* we can also select all properties at once using all */
            /* transition-property:all; */
            /* And we can also do transition on color and transform as well */
            /* transition-property: background-color , transform;
            transition-duration: 3s; */
            /* we can also select our own timing function from external view browser */
            /* transition-timing-function:ease-in-out ;
            transition-delay: 1s; */

            /* Shorthand way to apply the transition. */
            transition:all 3s ease-in-out 1s ;
            
        }
        .translate{
            background-color: brown;
            transform: translateX(20px) translateY(40px);
        }
        </style>
</head>
<body>
    <div class="container">
        <div class="box translate"></div>
    </div>
    
</body>
</html>
