    <title>CSS-Objectfit-ObjectCover</title>
    <style>
        .container{
            border: 2px solid;

            /* Here we are centering an image */
            background-position:center center ;

            /* As we know that image repeat if it is smaller than actual size of screen or width you provided so to pervent the repeatation we use repeat property. */
            background-repeat:no-repeat ;
            /*Clip property is used when we want only the selective content to be shown . i.e background-clip: padding-box ;  so here the image shown with padding box and remaining borders will be removed.*/
