<!DOCTYPE html>

    <title>css-Position-Property</title>
    <!-- Position:Positioning is one of the most powerful features in CSS because it lets you create layouts, fixed headers, sticky navigation bars, tooltips, modals, and much more. -->
    <!-- Static:By default, all elements have position: static;. They follow the normal document flow without any special positioning.It mean properties like top bottom left right z-index doesnot apply on it. -->

    <!-- Relative:Elements are positioned relative to the normal position in the document.
        You can use the top, right, bottom, and left properties to move the element from its original position. So to make changes in postion you have to change position from default static to relative or any other property. -->

    <!--Absolute:Elements are positioned relative to the closest positioned         ancestor  (parent), which means we need to have a parent element with  a positioning other than 'static'.
    Note: An absolutely positioned element is removed from the normal flow.  -->

    <!-- Fixed:An element with position: fixed; is positioned relative to the viewport (the screen itself). It does not move when the page is scrolled.
    This is useful for creating elements like fixed headers or footers. -->

    <!-- Sticky:Position sticky is a hybrid between 'relative' and 'fixed'.
    It allows an element to become "stuck" to the top or bottom of its container when scrolling, but it behaves like relative positioning within the container until it reaches a specified offset. -->

    <!-- Z-index:When there are multiple overlapping elements, the z-index helps in deciding the order of their visibility. The element having the highest value of z-index is shown first, followed by the other elements.

    Syntax

    selector {
    position: relative | absolute | fixed | sticky;
    z-index: value;
    }
    z-index value can be:

    Positive integer (e.g., 1, 10, 100) → Higher numbers appear above lower ones.
    Negative integer (e.g., -1) → Pushes the element behind others.
    Auto (default) → Follows the natural stacking order.
    Note: The z-index property only works on positioned elements (relative, absolute, fixed, sticky). -->
