<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fonts</title>
    <style>
        /* If we want to use custom fonts, we can use Google Fonts. You can choose any font you like from there. To use it, we can either link it in HTML or import it using @import inside the <style> tag. If you want to use multiple fonts (e.g., 3, 10, etc.), best practice is to import them together from Google Fonts in a single request. */
        @import url('https://fonts.googleapis.com/css2?family=Betania+Patmos&family=Caacupe+One&display=swap');

        h1 {
            /* Here we are using the font imported from Google Fonts */

            font-family: "Betania Patmos", cursive;
            font-weight: 400;
            font-style: normal;


            /* Whenever we want to change an element's font, we use font-family. Here you see multiple font names listed; all fonts except the first one (Franklin Gothic Medium) are fallback fonts. They serve as backups if the primary font fails to load. Explore other options as well */
            /* font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; */
            /* This is font-style, which as the name suggests, is used to style fonts. It is usually used to make text italic, but it has other features too */
            /* font-style: italic; */
            /* We use font-weight when we want to make the font bold */
            /* font-weight: 500; this numeric value determines how bold the font appears */
            /* If we want to underline text, we usually use text-decoration. It also has other values like overline, line-through, etc. */
            /* text-decoration: underline; */
        }

        p {
            /* opacity: Used to adjust element transparency, ranging from 0 (completely invisible) to 1 (fully visible). */
            opacity: 0.5;
            /* Font Size: This is used to set the font size. When autocomplete opens, it shows options like large, small, xl, etc., but using px (pixels) is generally more precise */
            font-size: 40px;
            /* line-height is used to manage spacing between lines of text (e.g., gap equivalent to 1 line, 2 lines, etc.) */
            line-height: 2;
            /* letter-spacing is used to set the amount of space between individual letters */
            /* letter-spacing: 25px; */
            font-family: "Caacupe One", sans-serif;
            font-weight: 400;
            font-style: normal;


            /* font-family: Verdana, Geneva, Tahoma, sans-serif; */
        }

        h2 {
            /* This is used for positioning text horizontally */
            text-align: center;
            /* text-transform is used to convert text to uppercase, lowercase, capitalize, etc. */
            text-transform: lowercase;
            text-decoration: underline;
            /* Changes the color of the text underline and other text decorations */
            text-decoration-color: aquamarine;
            /* Changes the underline style to dotted, wavy, solid, etc. */
            text-decoration-style: dotted;
            /* Specifies the thickness of the text decoration line */
            text-decoration-thickness: 7px;
        }

        .lorem {
            border: solid red;
            width: 50px;
            /* Controls how content is handled when it overflows its container border (e.g., clip, ellipsis). overflow: hidden hides any overflowing content */
            text-overflow: clip;
            overflow: hidden;
            /* word-break allows words to break across lines if they exceed container bounds */
            word-break: break-all;
        }
    </style>
</head>

<body>
    <div>
        <h1>Fonts</h1>
        <h2>About fonts</h2>
        <p>this is fonts</p>
        <p class="lorem">Lorem ipsum dolor sit amet consectetur adipisicing elit. Minima ipsum esse eaque itaque
            suscipit reiciendis voluptate perferendis maxime vel quis beatae doloremque asperiores architecto natus,
            accusantium obcaecati ut quos perspiciatis!</p>
    </div>
</body>

</html>
