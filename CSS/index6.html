<title>Specifity-Cascading Algorithm</title>
<!-- Cascading Algorithm: CSS stands for Cascading Stylesheets. The cascade is the algorithm for solving conflicts where multiple CSS rules apply to an HTML element. It's the reason that the above CSS will be purple.
    Understanding the cascade algorithm helps you understand how the browser resolves conflicts like this. The cascade algorithm has 4 distinct stages. -->

<!-- Specificity: Specificity
    CSS specificity determines which style rules get applied to an element when there are conflicts. Higher specificity means the style will be used. It's calculated based on styles, IDs, classes, and tag names -->

<!-- Position and order of appearance: the order in which your CSS rules appear.
    Specificity: an algorithm that determines which CSS selector has the strongest match.
    Origin: the order in which CSS appears and where it comes from, whether that is a browser style, CSS from a browser extension, or your authored CSS.
    Importance: some CSS rules are weighted more heavily than others, especially with the !important rule type. -->

<!-- If there are two rules that have selectors of identical specificity, the last one to be declared wins. In an HTML page, you can add styles in different ways: through a <link> tag at the top of your page and another at the bottom, the styles from the bottom one will be used. The same applies down on the page take priority.
    An inline style attribute with CSS declared in it will override all other CSS, regardless of its position, unless a declaration has !important defined. -->

<!-- Specificity Calculation: Inline:1000, Id:100, Class Selector, Attribute or pseudo Classes:10, Element Selector and Pseudo Elements:1, Universal Selector:0
    Then add up the all parts of selectors used -->
<style>
    /* So from all of this we know that .cpurple will apply. The reason is that class selectors have higher specificity than element selectors (10 vs 1). If there are multiple class rules, the one declared last wins. Moreover, if inline styles are used, all other selectors are ignored and inline CSS applies.
        To calculate specificity, simply add the values of each selector. For complex selectors like "div > p", both div and p have a value of 1, so the total specificity is 2.
        Try to read/organize CSS from top to bottom as last rules override earlier ones easily. Avoid inline styles as they can only be overridden using !important. Keep your website simple and creative, and always try to use classes so you can reuse them. */
    h1 {
        background-color: aqua;
    }

    .cyellow {
        background-color: yellow;
    }

    .cred {
        background-color: red;
    }

    .cpurple {
        background-color: purple;
    }

    /* Quick Quiz: Calculate the specificity of this
        a=1 + .harryclass=10 + .rohanclass=10 + [href]=10 + :hover=10 = 41 */
    a.harryclass.rohanclass[href]:hover {
        color: chartreuse;
    }
</style>
</head>

<body>
    &lt;p&gt; Order of Specificity:Inline Css&nbsp; &gt;&nbsp;Id Selector &nbsp;&gt;&nbsp;Class or Attribute
    Selector&nbsp;&gt;&nbsp;&nbsp;Element Selector&nbsp;&gt;&nbsp;&nbsp;Universal Selector &lt;\p&gt;

    <p class="cred cyellow cpurple">Hi This testing</p>


    <a class="harryclass rohanclass" href="https://www,google.com">Gooogle</a>


</body>

</html>
