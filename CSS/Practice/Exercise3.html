<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design-A-Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body{
            background-color: rgb(227, 226, 226);
        }

        .card {
            border: 2px solid none;
            position: absolute;
            top: 42px;
            padding: 12px;
            width: 29vw;
            left: 450px;
            height: 80vh;
            border-radius: 24px;
            background-color: white;
        }

        .image img {
            border-radius: 24px;
            width: 444px;
            height: 248px;
            background-color: white;
            
        }

        .clips span:first-child {
            border: 2px solid;
            border-radius: 24px;
            position: relative;
            top: 10px;
            padding: 5px;
            margin: 12px;
            color: rgb(129, 127, 127);
            font-weight: bold;
            
        }

        .clips span:nth-child(2) {
            border: 2px solid;
            border-radius: 24px;
            position: relative;
            top: 11px;
            padding: 4px;
            width: 20px;
            margin: 1px;
            color: rgb(129, 127, 127);
            font-weight: bold;
        }
        .content h1{
            position: relative;
            top: 26px;
            font-family: cursive;
        }
        .content p{
            position: relative;
            top: 30px;
            font-size: 1.3em;
            color: rgb(129, 127, 127);
            font-weight: bold;
            font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        .button {
            text-align: center;
        }
        .button button{
            border: 1px solid;
            border-radius: 24px;
            position: relative;
            top: 70px;
            width: 100px;
            padding: 7px;
            background-color: rgb(200, 231, 241);
            color: rgb(30, 152, 193);
            border: none;
        }
        
    </style>


</head>

<body>
    <div class="card">
        <div class="image">
            <img src="img.png" alt="----">
        </div>
        <div class="clips">
            <span>Fly </span>
            <span>Eat</span>
        </div>
        
        <div class="content">
            <h1>Aeroplane ticket</h1>
            
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Explicabo molestiae laborum itaque voluptas, dignissimos praesentium saepe facilis aliquam quas, voluptatem architecto enim beatae numquam dicta.</p>
        </div>
        <div class="button">
           <button>Read More</button>
        </div>
    </div>
</body>

</html>
