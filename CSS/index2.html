<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline-Internal-External CSS</title>
    <!--Internal CSS : We can use this CSS, but external CSS is mostly preferred. The reason is, for example, if you have a thousand lines of code with multiple h1 elements, updating them via internal CSS will bloat the HTML file with many extra lines. That's why creating a separate CSS file (external CSS) to write all styling code is best practice, which is why we use external instead of internal CSS.-->
    <!--The definition of Inline CSS is inside the index1.html file-->
    <!-- <style>
        h1{
            color: yellow;
            background-color: red;
        }

    </style> -->
    <!--External CSS : Here we linked an external CSS file with HTML which will contain all the CSS code-->
    <link rel="stylesheet" href="style2.css">
    <!--When to use which CSS:
    Inline CSS : Try to avoid using this in ideal cases.
    Internal CSS : Use this when the webpage is small and requires light styling.
    External CSS : Use this when building large production websites. Using external CSS is best practice because you can attach or detach it, and share it with teammates (e.g., one works on CSS while another works on HTML). Large websites like Netflix all use external CSS.-->

</head>

<body>

    <!--Inline CSS : We rarely use this CSS because, for example, if we have a thousand lines of code and want to change the color of every h1, finding each h1 and applying inline styles takes too much time. That's why it is rarely used—except when we need quick testing/debugging.-->
    <!-- <h1 style="color: yellow; background-color: red;">There are three ways to add CSS</h1> -->
    <h1>There are three ways to add CSS</h1>
    <div>
        <ol>
            <li> Inline CSS : </li>
            <li> Internal CSS : </li>
            <li> External CSS :</li>
        </ol>

    </div>

</body>
