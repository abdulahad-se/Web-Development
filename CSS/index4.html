<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS BOX Model(Margin-Padding-Borders)</title>
    <!--1. Content
    The innermost component of the box model is the actual content of the element. It can be text, image, video, etc.
    The content area is defined by the width and height properties.
    2. Padding
    The space between the actual content and the border of the element is the padding.
    The padding area is defined by the property padding.
    3. Border
    The border surrounds the content and padding and gives the visual border of the element.
    The border properties can be controlled using the border keyword.
    4. Margin
    The margin is the space outside the element that separates it from other elements in the layout.
    The margin of the element is controlled by the margin property. -->
    <style>
        /* we use margin to reset default css of browser */
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            background-color: blue;
        }

        .box1 {
            background-color: brown;
            margin: 25px;
            padding: 2px;
            border: 2px solid blue;
            height: 200px;
            /* box-sizing: border-box means that the 200px height includes content, padding, and border together.
    Real-Life Scenario:
    Suppose you want to fit 2 boxes side-by-side in a single row on screen equally (50% each):
    CSS
    .box {
    width: 50%;
    padding: 20px;  Padding added
    }
    WITHOUT border-box (Default):
    The browser calculates total width as 50% + 20px (left) + 20px (right). Total width exceeds 50%, causing the second box to break and drop to the next line.
    WITH border-box:
    The browser adjusts the 20px padding inside the 50% width. Each box stays at exactly 50% total width, fitting perfectly on a single row.
    Summary:
    Whenever you assign an exact width or height to an element (like cards, forms, buttons, layout columns) along with padding or border, use box-sizing: border-box so your layout does not break. */
            box-sizing: border-box;
        }

        /* Now here both margins are the same (25px and 25px), so neither is greater; this concept is called margin collapse. However, if box1 had a margin of 35px, 35px would apply instead of 25px to box2. When two vertical elements sit directly above/below each other, their vertical margins do not add up (25px + 25px = 50px does NOT happen). The browser applies whichever margin is maximum between the two. Margin collapse occurs only on vertical (top-bottom) margins. Horizontal (left-right) margins always sum together. */
        .box2 {
            color: red;
            background-color: bisque;
            margin: 25px;
            padding: 2px;
            border: 2px solid black;
            height: 200px;
            box-sizing: border-box;
        }
    </style>
</head>

<body>
    <div class="box box1">
        This is box 1
    </div>
    <div class="box box2" box>
        This is box 2
    </div>

</body>

</html>
