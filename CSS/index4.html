<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS BOX Model(Margin-Padding-Borders)</title>
    <!--1. Content
    The innermost component of the box model is the actual content of the element. It can be text, image, video, etc.
    The content area is defined by the width and height properties.
    2. Padding
    The space between the actual content and the border of the element is the padding.
    The padding area is defined by the property padding.
    3. Border
    The border surrounds the content and padding and gives the visual border of the element.
    The border properties can be controlled using the border keyword.
    4. Margin
    The margin is the space outside the element that separates it from other elements in the layout.
    The margin of the element is controlled by the margin property. -->
    <style>
        /* we use margin to reset default css of browser */
        *{
            margin: 0;
            padding: 0;
        }
        .box{
            background-color: blue;
        }
        .box1{
            background-color: brown;
            margin: 25px;
            padding: 2px;
            border: 2px solid blue;
            height: 200px;
            /* boxsizing:border-box ka ya matlab hai kah jo ya heigth 200px hai ya content,padding or border ko mila ka hai, 
            Real-Life Scenario:
            Maan lein aap 2 boxes ko ek hi row mein screen par barabar (50% each) fit karna chahte hain:
            CSS
            .box {
            width: 50%;
            padding: 20px; /* Padding add kar di   
             }
            border-box ke BINA (Default):
            Browser width calculate karega: 50% + 20px (left) + 20px (right). Total width 50% se ziada ho jaye gi, aur doosra box jagah na milne ki wajah se toot kar neeche waali line mein gir jaye ga.
            border-box KE SAATH:
            Browser padding: 20px ko 50% width ke andar hi adjust kar le ga. Single box bilkul 50% ka rahe ga aur dono boxes screen par ek hi line mein perfect fit ho jayen ge.
            Summary:
            Jab bhi aap kisi element ko exact width ya height dete hain (jaise cards, forms, buttons, layout columns) aur us par padding ya border bhi lagate hain, tab box-sizing: border-box use hota hai taake aap ka page layout toote nahi. */
            box-sizing: border-box;
        }
        /* ab yaha pr dono ka margin same hai means 25 or 25 to in dono me se max koi nhi hai is ko ham kehte hai margin collapsed , but for example agar box1 ki margin 35 hoti so phir 35 implement hoti na ka 25 box 2 ko, Jab do vertical elements ek doosre ke ooper-neoche aate hain, unka vertical margin add nahi hota (25px + 25px = 50px ❌ nahi hota). Browser dono me se jo max/bada margin hota hai, wahi apply karta hai. Margin collapse sirf vertical (top-bottom) margins par hota hai. Horizontal (left-right) margins hamesha add hote hain.*/
        .box2{
            color: red;
            background-color: bisque;
            margin: 25px;
            padding: 2px;
            border: 2px solid black;
            height: 200px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
   <div class="box box1">
    This is box 1
   </div>
   <div class="box box2" box>
    This is box 2
   </div>

</body>
</html>
