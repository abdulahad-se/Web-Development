<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selector</title>
    <style>
        /* Element Selector
        A CSS selector is the exact target pointing to an HTML element so you can style it. It has some drawbacks; for example, if we change the background color of one div, all divs in the file will also have their background color changed. If we don't want other divs to change, we must use another selector instead. For example, targeting only elements where class is red. */
        div {
            /* background-color: red; */
        }

        /* Class Selector :class Selector
        Targets all HTML elements that have a specific class attribute (prefixed with .).
        Syntax: .card { color: red; } */
        /* .red means class is red */
        .red {
            background-color: red;
        }

        /* Id Selector :ID Selector
        Targets a single, unique HTML element on the page with a specific id attribute (prefixed with #).
        Syntax: #header { color: red; } */
        /* #green means id is green */
        #green {
            background-color: green;
        }

        /* Child Selector :Child Selector
        Targets only elements that are immediate (direct) children of a specified parent element (using >).
        Syntax: div > p { color: red; } (targets only <p> directly inside <div>) */
        /* So here p is a child of div, meaning the paragraph is inside the div element. This changes both font color and background of paragraphs inside div elements. For example, if there is another element inside div (like article) and paragraph is inside that article, this property will not apply.
        This selector applies only if p is a direct child of div. If we want it to apply regardless of nesting depth, we use the descendant selector instead. */
        div>p {
            color: blue;
            background-color: azure;
        }

        /* Descendant Selector :Descendant Selector
    Targets all elements nested anywhere inside a specified ancestor element, regardless of how deep they are (using a space).
    Syntax: div p { color: red; } (targets all <p> inside <div>, including inside nested tags) */
        /* What we are doing here is targeting any p inside div, no matter how deeply nested it is, as long as it exists */
        div p {
            color: blueviolet;
            background-color: burlywood;
        }

        /* Universal Selector :Universal Selector
    Targets every single element on the web page using an asterisk (*).
    Syntax: * { margin: 0; } */
        /* This means I want to set margin and padding to 0 for all elements (if you check the preview without this, there is default spacing, but when this is applied, elements align to the top/edges) */
        * {
            margin: 0;
            padding: 0;
        }

        /* Pseudo Selector :Pseudo-Selector
    Targets an element based on a specific state or condition (pseudo-classes using :) or styles a specific part of an element (pseudo-elements using ::).

    Syntax: a:hover { color: red; } (styles links only when hovered)*/
        /* If I want to change the color of a link after it has been visited to a custom color, I will use pseudo-selectors */

        /* Pro Tip for Link States: Remember the order rule LVHA (Lord Vader Has Arrived): :link -> :visited -> :hover -> :active. If you put :hover before :link, the hover effect will fail to trigger. */
        a:visited {
            color: yellow;
        }

        /* If I want any link I add to have a specific color like blue or custom RGB, I will use pseudo-selectors */
        a:link {
            color: rgb(37, 37, 39);
        }

        /* If I want the link color to change to a custom color when I hover over it, I will use pseudo-selectors */
        a:hover {
            color: brown;
        }

        /* If I want a custom color to appear when I click on the link at the exact moment of clicking, I use :active (or add a simple background if needed) */
        a:active {
            color: red;
        }

        /* This is also a pseudo-selector. It basically means: set the background color to chocolate wherever p is the first child of its parent element */
        p:first-child {
            background-color: chocolate;
        }

        /* We can also use ::after if we want; it simply inserts a shape, icon, or content ahead/after */
        /* ::before - Inserts an icon before the link text without touching HTML */
        .btn::before {
            content: "👉 ";
        }

        /* :focus - Styles inputs or buttons when clicked or selected via keyboard (crucial for form fields and web accessibility).
    Focus (:focus): Triggers when an element receives input or key selection (input:focus { outline: 2px solid blue; }).*/
        input:focus {
            outline: 3px solid blue;
            /* Highlights when clicked into */
        }

        /* Attribute Selector ([attr="val"]): Targets specific input types
    This code snippet is taken for reference to show that there are many options, but these are suggested for now */
        input[type="text"] {
            border: 3px solid black;
            padding: 8px;
        }

        /* Group Selector :The group selector is used to minimize the code. Commas , are used to separate each selector in a grouping. This reduces the number of lines of code. The code also looks clean.*/
        /* div, p, a {
        property: value;
    } */
    </style>
    </style>
</head>

<body>
    <main class="one">
        <p>I am first</p>
        <p>I am second</p>
    </main>

    <div class="red">
        hi i am div
        <p>I am para inside div</p>
    </div>
    <div id="green">
        Hi i am div 2
    </div>
    <a target="_blank" href="https://www.google.com">Google</a>
    <a target="_blank" href="httpsp://www.odoo.com">Odoo</a>
    <input type="text" placeholder="Enter your name">
    <button class="btn" type="submit">Submit</button>
</body>

</html>
